name: build

# Se lance :
#  - à la publication d'une Release sur GitHub (les fichiers y sont alors attachés automatiquement)
#  - à la main (onglet Actions > build > Run workflow) pour un simple test, sans Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests du moteur
        run: cargo test -p ataecina-core
      - name: CLI Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: src-tauri
        run: cargo tauri build
      - name: Exe portable
        shell: bash
        run: cp target/release/ataecina.exe "Ataecina_$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)_portable.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: ataecina-windows
          path: |
            Ataecina_*_portable.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
      - name: Attacher à la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Ataecina_*_portable.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
