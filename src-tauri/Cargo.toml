[package]
name = "ataecina"
version = "0.11.0"
edition = "2021"
authors = ["Domingo Olmo Martin"]
license = "MIT"
description = "Récupération et réparation de rushes vidéo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ataecina-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
